repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        exclude: .*templates/
    -   id: check-json
    -   id: check-xml
    -   id: check-toml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files
        args: ['--maxkb=20000']
    -   id: check-merge-conflict
    -   id: pretty-format-json
        args: [--no-ensure-ascii,--autofix]
    -   id: detect-aws-credentials
        args: [--allow-missing-credentials]
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
    -   id: actionlint-docker
        args: [-shellcheck=, -pyflakes=] # ignore shellcheck and pyflake
-   repo: https://github.com/golangci/golangci-lint
    rev: v2.8.0
    hooks:
    -   id: golangci-lint
-   repo: local
    hooks:
    -   id: check-data-providers-table
        name: check Data providers table
        description: Fails if docs/DATA_PROVIDERS.md's table is out of date with internal/catalogdocs (run `make generate-data-providers-table` to fix)
        entry: make check-data-providers-table
        language: system
        pass_filenames: false
        files: ^(catalog\.go|internal/catalogdocs/|docs/DATA_PROVIDERS\.md)
